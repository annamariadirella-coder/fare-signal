<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-labelledby="title desc"><title id="title">When a train falls below the budget</title><desc id="desc">Illustrated Telegram chat. Budget below EUR 40. Made-up direct train NF 208 costs EUR 34.90 and leaves at 15:38. Price checked twice. No real message sent.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.muted{fill:#64736a}.ink{fill:#25352e}.green{fill:#226644}</style><rect width="640" height="800" rx="24" fill="#f2f4ee"/>
<text x="32" y="43" font-size="16" letter-spacing="1.5" fill="#68776a">ILLUSTRATED EXAMPLE · MADE-UP DATA</text>
<rect x="30" y="68" width="580" height="670" rx="24" fill="#e5ede1" stroke="#c4d0bf"/>
<path d="M54 68H586Q610 68 610 92V163H30V92Q30 68 54 68" fill="#253c32"/>
<circle cx="76" cy="115" r="23" fill="#b4d6be"/>
<path d="M65 119L89 103L80 128L75 119L65 119Z" fill="#253c32"/>
<text x="115" y="109" font-size="24" font-weight="700" fill="#fff">Fare Signal</text>
<text x="115" y="137" font-size="17" fill="#c8decc">bot · simulated Telegram chat</text>
<rect x="201" y="185" width="380" height="56" rx="14" fill="#cde5c4"/>
<text x="224" y="220" font-size="20" fill="#29482c">Tell me when it is below €40.</text>
<rect x="55" y="264" width="526" height="388" rx="16" fill="#fffef9"/>
<text x="78" y="299" font-size="17" fill="#236646" font-weight="700">FARE SIGNAL · EXAMPLE ALERT</text>
<text x="78" y="347" font-size="27" font-weight="700" fill="#25352e">A train is below your budget!</text>
<text x="78" y="416" font-size="62" font-weight="700" fill="#226644">€34.90</text>
<text x="78" y="454" font-size="22" fill="#25352e">Your limit: less than €40.00</text>
<text x="78" y="496" font-size="22" fill="#25352e">NF 208 · direct · 15:38 → 18:16</text>
<text x="78" y="528" font-size="21" fill="#25352e">Northport Central → Linden Hbf</text>
<text x="78" y="560" font-size="21" fill="#25352e">14 March 2027 · 1 adult · 2nd class</text>
<path d="M78 580H554" stroke="#dbe2d5"/>
<text x="78" y="610" font-size="20" fill="#226644">✓ Same train and price, checked twice.</text>
<text x="78" y="638" font-size="18" fill="#64736a">Check the booking site before buying.</text>
<text x="58" y="689" font-size="18" fill="#4b654a">You choose whether to buy. Fares may change.</text>
<text x="58" y="720" font-size="17" fill="#64736a">No real message was sent.</text>
<text x="32" y="774" font-size="17" fill="#64736a">Example fare and journey, not the ticket we bought.</text></svg>