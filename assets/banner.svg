<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc"><title id="title">Fare Signal</title><desc id="desc">Less noise. Better fares. A fictional monitoring demo: verify twice, notify once.</desc><rect width="1280" height="560" rx="16" fill="#f5f3ed"/><path d="M700 410h160c90 0 20-270 140-270h235" fill="none" stroke="#dedfd5" stroke-width="30"/><path d="M700 410h160c90 0 20-270 140-270h235" fill="none" stroke="#dc582c" stroke-width="4" stroke-dasharray="5 10"/><circle cx="744" cy="410" r="12" fill="#f5f3ed" stroke="#26312b" stroke-width="4"/><circle cx="1190" cy="140" r="12" fill="#dc582c"/><text x="76" y="77" font-family="Arial,sans-serif" font-size="25" fill="#26312b" font-weight="700">fare<tspan font-weight="400">signal</tspan><tspan fill="#dc582c">.</tspan></text><text x="76" y="198" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" fill="#68726a">VERIFY TWICE. NOTIFY ONCE.</text><text x="70" y="295" font-family="Georgia,serif" font-size="89" fill="#26312b">Less noise.</text><text x="70" y="390" font-family="Georgia,serif" font-size="89" font-style="italic" fill="#d84d23">Better fares.</text><text x="76" y="466" font-family="Arial,sans-serif" font-size="17" fill="#68726a">An interactive engineering case study. All demo data is fictional.</text><g transform="translate(936 205) rotate(-8)"><rect width="240" height="158" rx="10" fill="#fffdf8" stroke="#cdd3c6"/><text x="25" y="33" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" fill="#27714b">PRICE CONFIRMED</text><text x="22" y="101" font-family="Arial,sans-serif" font-size="57" fill="#26312b">€34.90</text><path d="M24 119h190" stroke="#cdd3c6" stroke-dasharray="4 4"/><text x="24" y="142" font-family="Arial,sans-serif" font-size="10" fill="#68726a">Two reads. One signal.</text></g></svg>
