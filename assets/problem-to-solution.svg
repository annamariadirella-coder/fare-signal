<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">The problem and how I solved it</title><desc id="desc">Rising fares. A wider search for direct trains after 12:30. Checks every two hours. Double check and no repeats. Telegram alert. Manual purchase and watcher stopped.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.muted{fill:#64736a}.ink{fill:#25352e}.green{fill:#226644}</style><rect width="1200" height="610" rx="18" fill="#f5f3ed"/><text x="38" y="52" font-size="28" font-weight="700" fill="#25352e">From a real problem to a useful alert</text><text x="38" y="85" font-size="20" fill="#64736a">The original system’s story. The demo uses simulated data and messages.</text><rect x="30" y="118" width="360" height="210" rx="12" fill="#fffef9" stroke="#d7ddcf"/><text x="52" y="154" font-size="19" fill="#d34f27">01</text><text x="52" y="195" font-size="23" font-weight="700" fill="#25352e">My problem</text><text x="52" y="239" font-size="19" fill="#64736a">The train fare kept rising.</text><text x="52" y="272" font-size="19" fill="#64736a">I did not want to keep checking.</text><rect x="420" y="118" width="360" height="210" rx="12" fill="#fffef9" stroke="#d7ddcf"/><text x="442" y="154" font-size="19" fill="#d34f27">02</text><text x="442" y="195" font-size="23" font-weight="700" fill="#25352e">A wider search</text><text x="442" y="239" font-size="19" fill="#64736a">Later trains would work too.</text><text x="442" y="272" font-size="19" fill="#64736a">Direct only, after 12:30.</text><rect x="810" y="118" width="360" height="210" rx="12" fill="#fffef9" stroke="#d7ddcf"/><text x="832" y="154" font-size="19" fill="#d34f27">03</text><text x="832" y="195" font-size="23" font-weight="700" fill="#25352e">Automatic checks</text><text x="832" y="239" font-size="19" fill="#64736a">The system checked every 2 hours.</text><text x="832" y="272" font-size="19" fill="#64736a">My home computer could stay off.</text><rect x="30" y="353" width="360" height="210" rx="12" fill="#fffef9" stroke="#d7ddcf"/><text x="52" y="389" font-size="19" fill="#d34f27">04</text><text x="52" y="430" font-size="23" font-weight="700" fill="#25352e">Check twice, then decide</text><text x="52" y="474" font-size="19" fill="#64736a">Same train. Same price.</text><text x="52" y="507" font-size="19" fill="#64736a">Below €40. No repeat alerts.</text><rect x="420" y="353" width="360" height="210" rx="12" fill="#fffef9" stroke="#d7ddcf"/><text x="442" y="389" font-size="19" fill="#d34f27">05</text><text x="442" y="430" font-size="23" font-weight="700" fill="#25352e">The Telegram message</text><text x="442" y="474" font-size="19" fill="#64736a">The bot told me in the chat.</text><text x="442" y="507" font-size="19" fill="#64736a">I opened the site and decided.</text><rect x="810" y="353" width="360" height="210" rx="12" fill="#fffef9" stroke="#d7ddcf"/><text x="832" y="389" font-size="19" fill="#d34f27">06</text><text x="832" y="430" font-size="23" font-weight="700" fill="#25352e">Ticket bought. Stop.</text><text x="832" y="474" font-size="19" fill="#64736a">We found a suitable train.</text><text x="832" y="507" font-size="19" fill="#64736a">Then we stopped the watcher.</text></svg>