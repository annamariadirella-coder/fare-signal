<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Il problema e come l’ho risolto</title><desc id="desc">Prezzi in aumento. Ricerca estesa ai diretti dopo le 12:30. Controllo ogni due ore. Doppia verifica e niente doppioni. Avviso Telegram. Acquisto manuale e monitor spento.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.muted{fill:#64736a}.ink{fill:#25352e}.green{fill:#226644}</style><rect width="1200" height="610" rx="18" fill="#f5f3ed"/><text x="38" y="52" font-size="28" font-weight="700" fill="#25352e">Da un problema concreto a un avviso utile</text><text x="38" y="85" font-size="20" fill="#64736a">La storia del sistema originale. Nella demo, dati e messaggi sono simulati.</text><rect x="30" y="118" width="360" height="210" rx="12" fill="#fffef9" stroke="#d7ddcf"/><text x="52" y="154" font-size="19" fill="#d34f27">01</text><text x="52" y="195" font-size="23" font-weight="700" fill="#25352e">Il mio problema</text><text x="52" y="239" font-size="19" fill="#64736a">Il prezzo del treno saliva.</text><text x="52" y="272" font-size="19" fill="#64736a">Non volevo controllare ogni ora.</text><rect x="420" y="118" width="360" height="210" rx="12" fill="#fffef9" stroke="#d7ddcf"/><text x="442" y="154" font-size="19" fill="#d34f27">02</text><text x="442" y="195" font-size="23" font-weight="700" fill="#25352e">Una ricerca più ampia</text><text x="442" y="239" font-size="19" fill="#64736a">Andavano bene anche altri treni.</text><text x="442" y="272" font-size="19" fill="#64736a">Solo diretti, dopo le 12:30.</text><rect x="810" y="118" width="360" height="210" rx="12" fill="#fffef9" stroke="#d7ddcf"/><text x="832" y="154" font-size="19" fill="#d34f27">03</text><text x="832" y="195" font-size="23" font-weight="700" fill="#25352e">Il controllo automatico</text><text x="832" y="239" font-size="19" fill="#64736a">Il sistema cercava circa ogni 2 ore.</text><text x="832" y="272" font-size="19" fill="#64736a">Il PC di casa poteva restare spento.</text><rect x="30" y="353" width="360" height="210" rx="12" fill="#fffef9" stroke="#d7ddcf"/><text x="52" y="389" font-size="19" fill="#d34f27">04</text><text x="52" y="430" font-size="23" font-weight="700" fill="#25352e">Due controlli, poi la scelta</text><text x="52" y="474" font-size="19" fill="#64736a">Stesso treno e stesso prezzo.</text><text x="52" y="507" font-size="19" fill="#64736a">Sotto 40 €, senza ripetere avvisi.</text><rect x="420" y="353" width="360" height="210" rx="12" fill="#fffef9" stroke="#d7ddcf"/><text x="442" y="389" font-size="19" fill="#d34f27">05</text><text x="442" y="430" font-size="23" font-weight="700" fill="#25352e">Il messaggio Telegram</text><text x="442" y="474" font-size="19" fill="#64736a">Il bot mi avvisava in chat.</text><text x="442" y="507" font-size="19" fill="#64736a">Io aprivo il sito e decidevo.</text><rect x="810" y="353" width="360" height="210" rx="12" fill="#fffef9" stroke="#d7ddcf"/><text x="832" y="389" font-size="19" fill="#d34f27">06</text><text x="832" y="430" font-size="23" font-weight="700" fill="#25352e">Biglietto comprato. Stop.</text><text x="832" y="474" font-size="19" fill="#64736a">Abbiamo trovato un treno adatto.</text><text x="832" y="507" font-size="19" fill="#64736a">Poi abbiamo spento il monitor.</text></svg>